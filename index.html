<!DOCTYPE html>
<html>
<head>
  <title>Hi Chat</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b0f1a;
      color: white;
    }

    header {
      background: #4169E1;
      padding: 15px;
      font-size: 20px;
    }

    #container {
      display: flex;
      height: 90vh;
    }

    #users {
      width: 30%;
      border-right: 1px solid #333;
      overflow-y: auto;
    }

    #chatArea {
      width: 70%;
      display: flex;
      flex-direction: column;
    }

    .user {
      padding: 10px;
      border-bottom: 1px solid #222;
      cursor: pointer;
    }

    .user:hover {
      background: #1a1f2e;
    }

    #chat {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .msg {
      padding: 10px;
      margin: 5px;
      border-radius: 10px;
      max-width: 60%;
    }

    .me {
      background: #4169E1;
      align-self: flex-end;
    }

    .other {
      background: #1a1f2e;
      align-self: flex-start;
    }

    #inputArea {
      display: flex;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
    }

    button {
      background: #4169E1;
      color: white;
      border: none;
      padding: 10px;
    }
  </style>
</head>

<body>

<header>💬 Hi Chat</header>

<!-- LOGIN -->
<div id="login">
  <input id="phone" placeholder="+234..." />
  <div id="recaptcha"></div>
  <button onclick="sendOTP()">Send Code</button>

  <input id="code" placeholder="OTP" />
  <button onclick="verifyCode()">Login</button>
</div>

<!-- APP -->
<div id="container" style="display:none;">

  <!-- USERS -->
  <div id="users"></div>

  <!-- CHAT -->
  <div id="chatArea">
    <div id="chat"></div>

    <div id="inputArea">
      <input id="message" placeholder="Type message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>

<script>
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_PROJECT",
  projectId: "YOUR_PROJECT_ID",
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

let currentChatUser = null;
let confirmationResult;

// Recaptcha
window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha');

// LOGIN
function sendOTP() {
  auth.signInWithPhoneNumber(phone.value, recaptchaVerifier)
    .then(res => {
      confirmationResult = res;
      alert("Code sent");
    });
}

function verifyCode() {
  confirmationResult.confirm(code.value)
    .then(res => {
      startApp(res.user);
    });
}

// START APP
function startApp(user) {
  document.getElementById("login").style.display = "none";
  document.getElementById("container").style.display = "flex";

  db.collection("users").doc(user.uid).set({
    phone: user.phoneNumber
  });

  loadUsers();
}

// LOAD USERS
function loadUsers() {
  db.collection("users").onSnapshot(snapshot => {
    users.innerHTML = "";
    snapshot.forEach(doc => {
      if (doc.id !== auth.currentUser.uid) {
        let div = document.createElement("div");
        div.className = "user";
        div.textContent = doc.data().phone;

        div.onclick = () => openChat(doc.id);

        users.appendChild(div);
      }
    });
  });
}

// OPEN CHAT
function openChat(uid) {
  currentChatUser = uid;

  db.collection("messages")
    .orderBy("time")
    .onSnapshot(snapshot => {
      chat.innerHTML = "";

      snapshot.forEach(doc => {
        let msg = doc.data();

        if (
          (msg.from === auth.currentUser.uid && msg.to === uid) ||
          (msg.from === uid && msg.to === auth.currentUser.uid)
        ) {
          let div = document.createElement("div");

          div.className = "msg " + 
            (msg.from === auth.currentUser.uid ? "me" : "other");

          div.textContent = msg.text;

          chat.appendChild(div);
        }
      });
    });
}

// SEND MESSAGE
function sendMessage() {
  if (!currentChatUser) return;

  db.collection("messages").add({
    text: message.value,
    from: auth.currentUser.uid,
    to: currentChatUser,
    time: Date.now()
  });

  message.value = "";
}
</script>

</body>
</html>
