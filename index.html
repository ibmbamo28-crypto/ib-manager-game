<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IB Manager Game</title>

<style>
body { margin:0; font-family:Arial; overflow:hidden; }

/* SPLASH */
#splash {
  width:100vw; height:100vh; background:black;
  display:flex; justify-content:center; align-items:center;
}
#splash img { width:120px; }

/* SCREENS */
.screen {
  width:100vw; height:100vh;
  display:none;
  justify-content:center; align-items:center;
  flex-direction:column;
  background:#1e7f3f; color:white;
}

/* GAME */
#game {
  display:none;
  width:100vw; height:100vh;
  background:green;
  position:relative;
}

/* PLAYERS */
.player {
  width:30px; height:30px;
  border-radius:50%;
  position:absolute;
  color:white;
  font-size:10px;
  text-align:center;
  line-height:30px;
}

/* GOALKEEPER */
.goalkeeper {
  width:0; height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  position:absolute;
}

/* BALL */
.ball {
  width:10px; height:10px;
  background:white;
  border-radius:50%;
  position:absolute;
}

/* COMMENTARY */
#commentaryBar {
  position:absolute;
  top:-50px;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  color:white;
  padding:8px;
  transition:top 0.5s;
}

#commentaryBar.show { top:0; }

#commentaryLogo {
  width:20px; height:20px;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <img src="icon.png">
</div>

<!-- MANAGER -->
<div id="managerScreen" class="screen">
  <h2>Enter Manager Name</h2>
  <input id="managerName">
  <button onclick="saveManager()">Continue</button>
</div>

<!-- CONTRACT -->
<div id="contractScreen" class="screen">
  <h2>Contract Offer</h2>
  <p id="contractText"></p>
  <button onclick="acceptContract()">Accept</button>
</div>

<!-- MENU -->
<div id="menu" class="screen">
  <h2>Main Menu</h2>
  <button onclick="startGame()">Play Match</button>
</div>

<!-- GAME -->
<div id="game">

  <div id="commentaryBar">
    <img id="commentaryLogo">
    <span id="commentaryText"></span>
  </div>

</div>

<script>

// FLOW
setTimeout(()=>{
  splash.style.display="none";
  managerScreen.style.display="flex";
},3000);

let manager="";

function saveManager(){
  manager = managerName.value;
  managerScreen.style.display="none";
  contractScreen.style.display="flex";
  contractText.innerText = "Welcome "+manager+"!\nManage IB FC.";
}

function acceptContract(){
  contractScreen.style.display="none";
  menu.style.display="flex";
}

function startGame(){
  menu.style.display="none";
  game.style.display="block";
  startMatch();
}

// TEAM COLORS + LOGO
let teamColors = {
  "Barcelona":"#A50044",
  "Bayern Munich":"#DC052D"
};

let teamLogos = {
  "Barcelona":"https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg",
  "Bayern Munich":"https://upload.wikimedia.org/wikipedia/en/1/1f/FC_Bayern_München_logo_%282017%29.svg"
};

let currentTeam="Barcelona";

// COMMENTARY
function updateCommentary(text, teamName){
  commentaryText.innerText = text;
  commentaryBar.style.background = teamColors[teamName] || "black";
  commentaryLogo.src = teamLogos[teamName] || "";

  commentaryBar.classList.add("show");

  setTimeout(()=>{
    commentaryBar.classList.remove("show");
  },3000);
}

// GAME DATA
let team = [
  {name:"10",x:100,y:200,energy:100},
  {name:"7",x:150,y:100,energy:100}
];

let ball = {x:300,y:200};

// DRAW
function draw(){
  game.innerHTML += "";

  // ball
  let b=document.createElement("div");
  b.className="ball";
  b.style.left=ball.x+"px";
  b.style.top=ball.y+"px";
  game.appendChild(b);

  // players
  team.forEach(p=>{
    let d=document.createElement("div");
    d.className="player";
    d.style.background="blue";
    d.style.left=p.x+"px";
    d.style.top=p.y+"px";
    d.innerText=p.name;
    game.appendChild(d);
  });
}

// ENERGY + CARDS
function updatePlayers(){
  team.forEach(p=>{
    p.energy -= Math.random()*2;

    if(Math.random()<0.02){
      updateCommentary("🟨 Yellow Card!", currentTeam);
    }

    if(Math.random()<0.01){
      updateCommentary("🟥 RED CARD!", currentTeam);
    }
  });
}

// MATCH LOOP
function gameLoop(){
  updatePlayers();
  draw();

  if(Math.random()<0.05){
    updateCommentary("⚽ GOAL!!!", currentTeam);
  }
}

// START MATCH
function startMatch(){
  setInterval(gameLoop,1000);
}

</script>

</body>
</html>
